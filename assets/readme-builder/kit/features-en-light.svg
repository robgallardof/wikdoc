<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="406" viewBox="0 0 1200 406" role="img" aria-label="Your code stays on your machine: Embeddings and answers come from Ollama running locally; nothing is fine-tuned or uploaded. · Retrieve, then answer: Answers are built from the indexed chunks of your folder. · Many languages: C#, Java, TS/JS, Python, configs and docs in one index. · Chat anywhere: Interactive menu, CLI, a Gradio browser UI or any OpenAI-compatible client. · Share an index: Export and import an index as a pack." data-readme-component="bento"><title>Your code stays on your machine: Embeddings and answers come from Ollama running locally; nothing is fine-tuned or uploaded. · Retrieve, then answer: Answers are built from the indexed chunks of your folder. · Many languages: C#, Java, TS/JS, Python, configs and docs in one index. · Chat anywhere: Interactive menu, CLI, a Gradio browser UI or any OpenAI-compatible client. · Share an index: Export and import an index as a pack.</title><defs><linearGradient id="kb" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><linearGradient id="kbd" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}.orb{animation:orb 10s ease-in-out infinite}@keyframes orb{0%,100%{opacity:.08}50%{opacity:.22}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.75" y="0.75" width="793.833" height="194.5" rx="20" fill="#ffffff" stroke="#dfe5ef" stroke-width="1.5"/><circle class="orb" style="animation-delay:0s" cx="731.333" cy="48" r="26" fill="url(#kbd)" opacity=".12"/><rect x="24" y="24" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(33 33) scale(0.916667)" fill="non